- hosts: localhost
  become: true
  vars:
    http_server_status: "configuring"
    http_server_role: "ood"
  gather_facts: true
  roles:
    - oci-cloud-agent
    - http_server
    - privilege_group
    - packages
    - firewall
    - oci-hostname
    - ssh
    - limits
    - boot-volume
    - mgmt
    - oom-adjust

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: localdisk
      when: localdisk | default(true) | bool

- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: clean_tmp


## NFS client configuration for shared home directories. This needs to be modified per cluster config 
## FSS share would not be controller-hosted, so need to update the export_host accordingly
- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ controller_hostname }}"
        export_path: "/home"
        options: "defaults,noatime,bg,timeo=100,ac,actimeo=120,nocto,rsize=1048576,wsize=1048576,nolock,local_lock={{ lock }},mountproto=tcp,sec=sys,_netdev"
        lock: "all"
      when: shared_home == "nfs"
    - ansible.builtin.include_role:
        name: nfs-client
      vars:
        local_path: "/home"
        export_host: "{{ nfs_source_IP }}"
        export_path: "{% if create_fss == 'new' %}/home{% else %}{{ nfs_source_path }}/home{% endif %}"
        options: ""
        lock: "none"
        nfs_client_marker: "{{ fss_home_marker_path }}"
      when: shared_home == "fss"

- hosts: localhost
  become: true
  tasks:
    - ansible.builtin.include_role:
        name: sssd
      when: ldap | default(true) | bool

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: custom

- hosts: localhost
  vars:
    slurm_mode: "login"
  tasks:
    - ansible.builtin.include_role:
        name: slurm
      when: slurm | default(false) | bool

- hosts: localhost
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: open-ondemand

- hosts: localhost
  become: true
  vars:
    http_server_status: "configured"
    http_server_role: "ood"
  gather_facts: true
  roles:
    - http_server
