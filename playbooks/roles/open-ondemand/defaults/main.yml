---
# Portal identity
ood_servername: "{{ ansible_facts['fqdn'] }}"

# TLS (self-signed, generated locally on the OOD node)
ood_ssl_cert_dir_el: "/etc/pki/tls/certs"
ood_ssl_key_dir_el: "/etc/pki/tls/private"
ood_ssl_cert_dir_ubuntu: "/etc/ssl/certs"
ood_ssl_key_dir_ubuntu: "/etc/ssl/private"
ood_ssl_cert_days: 3650

# PAM auth service backing the portal login (relies on sssd already configured on the node)
ood_pam_service: "ood"

# Slurm adapter (playbooks/roles/slurm already installs the Slurm client binaries/munge key)
ood_slurm_bin_dir: "/usr/bin"
ood_slurm_conf_path: "/etc/slurm"

# Package repo versions
ood_el_release_rpm_url: "https://yum.osc.edu/ondemand/latest/ondemand-release-web-latest.noarch.rpm"
ood_ubuntu_repo_gpg_url: "https://apt.osc.edu/ondemand/pubkey.gpg"
ood_ubuntu_repo_base_url: "https://apt.osc.edu/ondemand"
